# --- Deposit OS ARM64 kernel features (appended to arch/arm64 defconfig) ---
# This is a first-class ARM build, NOT a modified x86 config: the base is the
# upstream arm64 defconfig, and this fragment adds only what Deposit OS needs
# on top (and the SoC families we target).

# Base arch + essentials
CONFIG_ARM64=y
CONFIG_ARM64_VA_BITS_48=y
CONFIG_ARM64_VA_BITS=48
CONFIG_ARM64_ERRATUM_858921=y
CONFIG_SCHED_MC=y
CONFIG_NR_CPUS=64
CONFIG_ARM_AMBA=y
CONFIG_USE_OF=y
CONFIG_OF=y
CONFIG_EFI=y
CONFIG_EFI_STUB=y

# VirtIO (QEMU virt machine + generic ARM boards)
CONFIG_VIRTIO_MMIO=y
CONFIG_VIRTIO_MMIO_CMDLINE_DEVICES=y

# Serial (PL011 is the ARM UART; used by QEMU virt and most boards)
CONFIG_SERIAL_AMBA_PL011=y
CONFIG_SERIAL_AMBA_PL011_CONSOLE=y

# PCI host generic (QEMU virt, generic UEFI, many boards)
CONFIG_PCI_HOST_GENERIC=y
CONFIG_PCI_DOMAINS=y

# Target SoC families
CONFIG_ARCH_BCM2835=y        # Raspberry Pi 3/4/5
CONFIG_ARCH_ROCKCHIP=y       # RK3399 / RK3588
CONFIG_ARCH_QCOM=y           # Qualcomm Snapdragon (X Elite via mainline)
CONFIG_ARCH_TEGRA=y          # NVIDIA Jetson / Grace-class (best-effort on 6.6)
CONFIG_I2C=y
CONFIG_I2C_BCM2835=y
CONFIG_SPI=y
CONFIG_THERMAL=y
CONFIG_CPU_THERMAL=y

# Networking on ARM boards
CONFIG_WLAN=y
CONFIG_BRCMFMAC=y             # Broadcom Wi-Fi (Pi, many SBCs)
CONFIG_NET_VENDOR_BROADCOM=y

# Open GPU drivers where available (closed GPUs fall back to simpledrm)
CONFIG_DRM_V3D=m              # Raspberry Pi GPU
CONFIG_DRM_PANFROST=m        # Mali (Rockchip / others)
CONFIG_DRM_ETNAVIV=m         # Vivante

# Watchdog / GPIO / audio
CONFIG_BCM2835_WDT=y
CONFIG_GPIO_BCM_VIRT=y
CONFIG_SND=y
CONFIG_SND_SOC=y
