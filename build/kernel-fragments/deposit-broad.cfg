# ============================================================================
# Deposit OS — broad, distro-class hardware support fragment.
# Appended to a defconfig base. Boot-critical drivers are built-in (=y) in
# build/build-kernel.sh; everything here is a module (=m) so the base image
# stays lean while the .mlpds carries drivers for "various things".
# Unknown symbols are ignored by olddefconfig.
# ============================================================================

