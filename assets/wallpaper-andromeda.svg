<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="Deposit OS Beta — Andromeda">
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0724"/>
      <stop offset="45%" stop-color="#150d36"/>
      <stop offset="100%" stop-color="#050310"/>
    </linearGradient>
    <radialGradient id="haloG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="38%" stop-color="#ffedd5"/>
      <stop offset="72%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#e9d5ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="armA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="armB" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="logoG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="vig" cx="46%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="72%" stop-color="#030209" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#030209" stop-opacity="0.62"/>
    </radialGradient>
    <filter id="b70" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="70"/></filter>
    <filter id="b40" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="b26" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="b22" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="b12" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="b6" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6"/></filter>
    <g id="flare"><path d="M0 -10 L1.8 -1.8 L10 0 L1.8 1.8 L0 10 L-1.8 1.8 L-10 0 L-1.8 -1.8 Z"/></g>
  </defs>

  <!-- deep space -->
  <rect width="1920" height="1080" fill="url(#space)"/>

  <!-- ambient nebulae -->
  <ellipse cx="300" cy="800" rx="300" ry="160" fill="#6d28d9" opacity="0.22" filter="url(#b70)"/>
  <ellipse cx="1680" cy="170" rx="260" ry="140" fill="#2563eb" opacity="0.18" filter="url(#b70)"/>
  <ellipse cx="480" cy="190" rx="230" ry="120" fill="#7c3aed" opacity="0.16" filter="url(#b70)"/>
  <ellipse cx="1450" cy="900" rx="280" ry="130" fill="#4f46e5" opacity="0.14" filter="url(#b70)"/>

  <!-- star field (hand-placed for renderer safety) -->
  <g fill="#ffffff">
    <circle cx="90" cy="90" r="1.4" opacity=".8"/><circle cx="210" cy="330" r="1.1" opacity=".6"/><circle cx="330" cy="150" r="1.6" opacity=".85"/><circle cx="430" cy="520" r="1.0" opacity=".5"/>
    <circle cx="520" cy="70" r="1.3" opacity=".7"/><circle cx="610" cy="270" r="1.1" opacity=".55"/><circle cx="700" cy="130" r="1.7" opacity=".9"/><circle cx="770" cy="420" r="1.0" opacity=".5"/>
    <circle cx="840" cy="240" r="1.2" opacity=".6"/><circle cx="930" cy="90" r="1.4" opacity=".75"/><circle cx="1010" cy="330" r="1.1" opacity=".55"/><circle cx="1090" cy="180" r="1.5" opacity=".8"/>
    <circle cx="1180" cy="70" r="1.2" opacity=".65"/><circle cx="1260" cy="250" r="1.0" opacity=".5"/><circle cx="1340" cy="140" r="1.6" opacity=".85"/><circle cx="1420" cy="320" r="1.1" opacity=".6"/>
    <circle cx="1510" cy="90" r="1.4" opacity=".75"/><circle cx="1590" cy="260" r="1.2" opacity=".6"/><circle cx="1670" cy="380" r="1.5" opacity=".8"/><circle cx="1750" cy="120" r="1.1" opacity=".55"/>
    <circle cx="1830" cy="290" r="1.6" opacity=".85"/><circle cx="1880" cy="450" r="1.0" opacity=".5"/><circle cx="60" cy="500" r="1.2" opacity=".6"/><circle cx="150" cy="650" r="1.5" opacity=".8"/>
    <circle cx="260" cy="760" r="1.1" opacity=".55"/><circle cx="370" cy="900" r="1.3" opacity=".7"/><circle cx="470" cy="1020" r="1.1" opacity=".55"/><circle cx="580" cy="880" r="1.4" opacity=".75"/>
    <circle cx="690" cy="980" r="1.0" opacity=".5"/><circle cx="800" cy="1040" r="1.3" opacity=".65"/><circle cx="910" cy="940" r="1.1" opacity=".55"/><circle cx="1020" cy="1030" r="1.5" opacity=".8"/>
    <circle cx="1130" cy="960" r="1.0" opacity=".5"/><circle cx="1240" cy="1010" r="1.3" opacity=".7"/><circle cx="1350" cy="920" r="1.1" opacity=".55"/><circle cx="1460" cy="1000" r="1.4" opacity=".75"/>
    <circle cx="1570" cy="940" r="1.0" opacity=".5"/><circle cx="1680" cy="1020" r="1.2" opacity=".6"/><circle cx="1790" cy="890" r="1.5" opacity=".8"/><circle cx="1870" cy="760" r="1.1" opacity=".55"/>
    <circle cx="1150" cy="560" r="1.0" opacity=".45"/><circle cx="1240" cy="600" r="1.2" opacity=".5"/><circle cx="1330" cy="540" r="0.9" opacity=".4"/><circle cx="1120" cy="300" r="1.1" opacity=".5"/>
    <circle cx="1050" cy="480" r="0.9" opacity=".4"/><circle cx="1310" cy="430" r="1.0" opacity=".45"/><circle cx="1390" cy="520" r="1.2" opacity=".5"/><circle cx="1470" cy="460" r="0.9" opacity=".4"/>
    <circle cx="1540" cy="560" r="1.1" opacity=".5"/><circle cx="1620" cy="500" r="1.0" opacity=".45"/><circle cx="720" cy="600" r="1.0" opacity=".45"/><circle cx="640" cy="660" r="1.2" opacity=".5"/>
    <circle cx="560" cy="620" r="0.9" opacity=".4"/><circle cx="820" cy="680" r="1.1" opacity=".5"/><circle cx="900" cy="620" r="0.9" opacity=".4"/><circle cx="980" cy="700" r="1.0" opacity=".45"/>
  </g>
  <!-- tinted stars -->
  <g>
    <circle cx="245" cy="215" r="1.8" fill="#bfdbfe" opacity=".9"/><circle cx="1495" cy="205" r="1.8" fill="#c7d2fe" opacity=".9"/>
    <circle cx="1710" cy="620" r="1.9" fill="#93c5fd" opacity=".95"/><circle cx="185" cy="835" r="1.7" fill="#ddd6fe" opacity=".85"/>
    <circle cx="965" cy="150" r="1.7" fill="#fde68a" opacity=".9"/><circle cx="1760" cy="330" r="1.6" fill="#bae6fd" opacity=".85"/>
  </g>
  <!-- flare stars -->
  <use href="#flare" x="395" y="255" fill="#ffffff" opacity="0.95" transform="translate(395 255) scale(0.9) translate(-395 -255)"/>
  <use href="#flare" x="1610" y="140" fill="#dbeafe" opacity="0.9"/>
  <use href="#flare" x="120" y="420" fill="#ede9fe" opacity="0.85"/>
  <use href="#flare" x="1530" y="800" fill="#bfdbfe" opacity="0.9"/>
  <use href="#flare" x="870" y="860" fill="#ffffff" opacity="0.8"/>
  <use href="#flare" x="1815" y="560" fill="#fef3c7" opacity="0.85"/>

  <!-- ===== Andromeda ===== -->
  <g transform="translate(1180 420) rotate(-28)">
    <!-- outer halo -->
    <ellipse rx="360" ry="128" fill="url(#haloG)" opacity="0.55" filter="url(#b40)"/>
    <!-- sweeping arms -->
    <path d="M -560 -24 C -400 -116, -160 -112, -20 -44 S 300 34, 530 -58"
          fill="none" stroke="url(#armA)" stroke-width="112" stroke-linecap="round"
          opacity="0.50" filter="url(#b22)"/>
    <path d="M -545 84 C -385 156, -140 136, 8 64 S 320 -8, 548 66"
          fill="none" stroke="url(#armB)" stroke-width="92" stroke-linecap="round"
          opacity="0.46" filter="url(#b22)"/>
    <!-- bright thin edges -->
    <path d="M -560 -24 C -400 -116, -160 -112, -20 -44 S 300 34, 530 -58"
          fill="none" stroke="#ddd6fe" stroke-width="11" stroke-linecap="round" opacity="0.85"/>
    <path d="M -545 84 C -385 156, -140 136, 8 64 S 320 -8, 548 66"
          fill="none" stroke="#bfdbfe" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
    <!-- dust lanes -->
    <path d="M -540 -52 C -395 -138, -165 -132, -25 -66 S 295 6, 512 -84"
          fill="none" stroke="#170b2e" stroke-width="24" stroke-linecap="round"
          opacity="0.55" filter="url(#b6)"/>
    <path d="M -528 56 C -375 122, -140 106, 4 40 S 315 -34, 532 40"
          fill="none" stroke="#150a28" stroke-width="22" stroke-linecap="round"
          opacity="0.5" filter="url(#b6)"/>
    <!-- blue young clusters on arms -->
    <g fill="#93c5fd">
      <circle cx="-470" cy="-72" r="3.2" opacity=".9"/><circle cx="-350" cy="-98" r="2.6" opacity=".85"/>
      <circle cx="-225" cy="-96" r="3.4" opacity=".9"/><circle cx="-95" cy="-72" r="2.4" opacity=".8"/>
      <circle cx="55" cy="-16" r="3.0" opacity=".85"/><circle cx="200" cy="8" r="2.6" opacity=".8"/>
      <circle cx="360" cy="6" r="3.2" opacity=".9"/><circle cx="480" cy="-34" r="2.5" opacity=".8"/>
    </g>
    <g fill="#67e8f9">
      <circle cx="-455" cy="108" r="2.8" opacity=".85"/><circle cx="-320" cy="128" r="2.4" opacity=".8"/>
      <circle cx="-180" cy="120" r="3.0" opacity=".85"/><circle cx="-40" cy="82" r="2.3" opacity=".75"/>
      <circle cx="110" cy="42" r="2.8" opacity=".85"/><circle cx="270" cy="18" r="2.4" opacity=".8"/>
      <circle cx="420" cy="26" r="2.9" opacity=".85"/><circle cx="520" cy="52" r="2.3" opacity=".75"/>
    </g>
    <!-- pink HII knots -->
    <g fill="#f0abfc">
      <circle cx="-300" cy="-104" r="2.6" opacity=".8"/><circle cx="120" cy="-2" r="2.4" opacity=".75"/>
      <circle cx="392" cy="0" r="2.6" opacity=".8"/><circle cx="-260" cy="126" r="2.4" opacity=".75"/>
      <circle cx="180" cy="34" r="2.3" opacity=".7"/>
    </g>
    <!-- bulge + core -->
    <ellipse rx="212" ry="66" fill="#a78bfa" opacity="0.8" filter="url(#b26)"/>
    <ellipse rx="122" ry="36" fill="url(#coreG)" filter="url(#b12)"/>
    <ellipse rx="54" ry="15" fill="#ffffff" opacity="0.96" filter="url(#b6)"/>
    <ellipse rx="22" ry="6" fill="#fffbeb" opacity="1"/>
  </g>

  <!-- vignette -->
  <rect width="1920" height="1080" fill="url(#vig)"/>

  <!-- top-right caption -->
  <text x="1856" y="64" text-anchor="end" font-family="Noto Sans, sans-serif"
        font-size="13" letter-spacing="10" fill="#a5b4fc" opacity="0.55">ANDROMEDA</text>

  <!-- brand pill -->
  <g transform="translate(64 976)">
    <rect width="470" height="68" rx="34" fill="#0a081a" opacity="0.55"
          stroke="#c4b5fd" stroke-opacity="0.35" stroke-width="1.5"/>
    <g transform="translate(16 16)">
      <rect width="36" height="36" rx="11" fill="url(#logoG)"/>
      <path d="M 8 14 q 10 -9 20 0" fill="none" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round"/>
      <rect x="7" y="21" width="22" height="5.4" rx="2.7" fill="#ffffff" opacity="0.96"/>
      <circle cx="18" cy="30" r="2.1" fill="#ffffff" opacity="0.92"/>
    </g>
    <text x="66" y="31" font-family="Noto Sans, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Deposit OS</text>
    <text x="66" y="51" font-family="Noto Sans, sans-serif" font-size="11.5" fill="#c7d2fe">Beta 0.1.0.7 · Andromeda · purple-blue · x86_64 + arm64</text>
  </g>
</svg>
