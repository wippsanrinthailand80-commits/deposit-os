<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="Deposit OS Beta Wallpaper Dark">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="45%" stop-color="#111d36"/>
      <stop offset="100%" stop-color="#1a2744"/>
    </linearGradient>
    <radialGradient id="blob1" cx="28%" cy="22%" r="65%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="82%" cy="78%" r="70%">
      <stop offset="0%" stop-color="#5b6ef5" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#5b6ef5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob3" cx="60%" cy="38%" r="50%">
      <stop offset="0%" stop-color="#22a8c8" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#22a8c8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logoG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="55%" stop-color="#22a8c8"/>
      <stop offset="100%" stop-color="#5b6ef5"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
    <linearGradient id="textG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#blob1)"/>
  <rect width="1920" height="1080" fill="url(#blob2)"/>
  <rect width="1920" height="1080" fill="url(#blob3)"/>
  <!-- subtle constellation -->
  <g fill="white" opacity="0.07">
    <circle cx="240" cy="180" r="1.8"/><circle cx="480" cy="140" r="1.2"/><circle cx="720" cy="220" r="1.5"/><circle cx="1380" cy="860" r="1.8"/><circle cx="1620" cy="720" r="1.3"/><circle cx="1120" cy="880" r="1.1"/>
  </g>
  <!-- centered logo card -->
  <g transform="translate(960,460)">
    <rect x="-140" y="-140" width="280" height="280" rx="64" fill="url(#logoG)" filter="url(#glow)"/>
    <path d="M -48 -18 q 48 -42 96 0" fill="none" stroke="white" stroke-width="18" stroke-linecap="round" opacity="0.96"/>
    <rect x="-62" y="22" width="124" height="28" rx="14" fill="white" opacity="0.96"/>
    <circle cx="0" cy="62" r="11" fill="white" opacity="0.92"/>
  </g>
  <text x="960" y="680" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="42" font-weight="700" fill="white" opacity="0.96">Deposit OS</text>
  <text x="960" y="718" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="18" font-weight="600" fill="#94a3b8" letter-spacing="6">BETA 0.1.0.7</text>
  <text x="960" y="748" text-anchor="middle" font-family="Noto Sans, sans-serif" font-size="13" fill="#64748b" opacity="0.95">From-the-kernel • apt/.deb compatible • Samsung One UI inspired</text>
  <!-- bottom pill -->
  <g transform="translate(960,980)">
    <rect x="-160" y="-18" width="320" height="36" rx="18" fill="white" opacity="0.08" stroke="white" stroke-opacity="0.12"/>
    <text x="0" y="6" text-anchor="middle" font-family="monospace" font-size="11" fill="white" opacity="0.72">deposit-compat • aqa • turbo • x86_64 + arm64</text>
  </g>
</svg>
