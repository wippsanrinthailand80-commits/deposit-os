<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Deposit OS logo: the Andromeda Galaxy (M31), original vector art -->
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fffdf4"/>
      <stop offset="0.3" stop-color="#ffe9bd"/>
      <stop offset="0.6" stop-color="#f2b96b"/>
      <stop offset="1" stop-color="#d98f3e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="disc" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c9d6ff"/>
      <stop offset="0.45" stop-color="#7d92d8"/>
      <stop offset="0.8" stop-color="#3c4f96"/>
      <stop offset="1" stop-color="#24305e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8fb4ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8fb4ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="laneA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#141b38" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#10162e" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#141b38" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- ambient halo -->
  <ellipse cx="256" cy="256" rx="240" ry="150" fill="url(#glow)" transform="rotate(-27 256 256)"/>

  <!-- galactic disc -->
  <g transform="rotate(-27 256 256)">
    <ellipse cx="256" cy="256" rx="205" ry="92" fill="url(#disc)"/>
    <ellipse cx="256" cy="256" rx="150" ry="60" fill="#93a7ea" opacity="0.35"/>
    <ellipse cx="256" cy="256" rx="100" ry="38" fill="#c3cff5" opacity="0.4"/>

    <!-- famous dust lanes of M31 -->
    <path d="M 70 236 Q 256 196 442 232 Q 256 214 70 236 Z" fill="url(#laneA)"/>
    <path d="M 84 268 Q 256 306 430 266 Q 256 296 84 268 Z" fill="url(#laneA)" opacity="0.85"/>

    <!-- young blue star clusters along the rim -->
    <ellipse cx="256" cy="256" rx="203" ry="90" fill="none" stroke="#bcd0ff" stroke-width="3" opacity="0.5"/>
    <ellipse cx="256" cy="256" rx="188" ry="80" fill="none" stroke="#9db8ff" stroke-width="2" opacity="0.35"/>

    <!-- bright nucleus -->
    <ellipse cx="256" cy="256" rx="66" ry="30" fill="url(#core)"/>
    <ellipse cx="256" cy="256" rx="18" ry="9" fill="#fffef8"/>
  </g>

  <!-- companion galaxies -->
  <circle cx="150" cy="368" r="9" fill="#e8d9b8" opacity="0.9"/>   <!-- M32 -->
  <ellipse cx="392" cy="130" rx="17" ry="8" fill="#cdbfa4" opacity="0.75" transform="rotate(-32 392 130)"/> <!-- M110 -->

  <!-- foreground stars -->
  <circle cx="86" cy="112" r="2.4" fill="#ffffff" opacity="0.9"/>
  <circle cx="452" cy="330" r="2" fill="#dbe6ff" opacity="0.8"/>
  <circle cx="404" cy="446" r="2.8" fill="#ffffff" opacity="0.85"/>
  <circle cx="120" cy="452" r="1.8" fill="#cdd9ff" opacity="0.7"/>
  <circle cx="474" cy="212" r="1.6" fill="#ffffff" opacity="0.65"/>
  <circle cx="52" cy="300" r="1.7" fill="#e6eeff" opacity="0.6"/>
  <circle cx="330" cy="52" r="2.1" fill="#ffffff" opacity="0.75"/>
  <circle cx="216" cy="480" r="1.5" fill="#dbe6ff" opacity="0.6"/>
</svg>
