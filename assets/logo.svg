<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Deposit OS — Andromeda galaxy">
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffdf6"/>
      <stop offset="35%" stop-color="#ffe9c4"/>
      <stop offset="70%" stop-color="#7fe7d4"/>
      <stop offset="100%" stop-color="#7fe7d400"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity=".55"/>
      <stop offset="45%" stop-color="#8b5cf6" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#8b5cf600"/>
    </radialGradient>
    <linearGradient id="armA" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity=".85"/>
      <stop offset="60%" stop-color="#67e8f9" stop-opacity=".65"/>
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity=".15"/>
    </linearGradient>
    <linearGradient id="armB" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0abfc" stop-opacity=".8"/>
      <stop offset="55%" stop-color="#93c5fd" stop-opacity=".6"/>
      <stop offset="100%" stop-color="#fef9c3" stop-opacity=".12"/>
    </linearGradient>
    <filter id="blurS" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="blurM" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>

  <!-- badge -->
  <rect x="4" y="4" width="248" height="248" rx="56" fill="#0b1020"/>
  <rect x="4" y="4" width="248" height="248" rx="56" fill="none" stroke="#5eead4" stroke-opacity=".35" stroke-width="2"/>

  <!-- galaxy halo + arms (inclined ~62deg like M31) -->
  <g transform="translate(128 128) rotate(-24)">
    <ellipse rx="104" ry="58" fill="url(#halo)" filter="url(#blurM)"/>
    <path d="M -100 34 C -64 -30 -20 -46 34 -38 C 74 -32 96 -14 104 2 C 74 -18 34 -22 -6 -10 C -52 4 -80 16 -100 34 Z"
          fill="url(#armB)" filter="url(#blurS)"/>
    <path d="M 100 34 C 64 -30 20 -46 -34 -38 C -74 -32 -96 -14 -104 2 C -74 -18 -34 -22 6 -10 C 52 4 80 16 100 34 Z"
          fill="url(#armA)" filter="url(#blurS)"/>
    <ellipse rx="86" ry="44" fill="#0b1020" opacity=".25" filter="url(#blurM)"/>
    <ellipse rx="52" ry="26" fill="url(#core)"/>
    <ellipse rx="20" ry="11" fill="#ffffff"/>
  </g>

  <!-- star field -->
  <g fill="#eef2ff">
    <circle cx="42" cy="52" r="1.6"/><circle cx="212" cy="44" r="2.1"/>
    <circle cx="188" cy="206" r="1.5"/><circle cx="60" cy="196" r="2.2"/>
    <circle cx="228" cy="120" r="1.4"/><circle cx="30" cy="132" r="1.3"/>
    <circle cx="98" cy="30" r="1.2"/><circle cx="160" cy="228" r="1.4"/>
  </g>
</svg>
