<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Deposit OS">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.55" stop-color="#22a8c8"/>
      <stop offset="1" stop-color="#5b6ef5"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0b1020" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="28" y="28" width="200" height="200" rx="56" ry="56" fill="url(#g)" filter="url(#soft)"/>
  <!-- deposit motif: a rounded tray catching a soft downward deposit -->
  <path d="M84 104 q44 -40 88 0" fill="none" stroke="#ffffff" stroke-width="16"
        stroke-linecap="round" opacity="0.95"/>
  <rect x="70" y="138" width="116" height="26" rx="13" ry="13" fill="#ffffff" opacity="0.95"/>
  <circle cx="128" cy="178" r="10" fill="#ffffff" opacity="0.9"/>
</svg>
