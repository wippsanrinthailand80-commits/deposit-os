name: Deposit OS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  # 1) Tool + .mlpds unit tests — fast, no network.
  # --------------------------------------------------------------------------
  tool-tests:
    name: mlpds tool + scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: syntax check
        run: |
          for f in tools/mlpds build/*.sh tools/mlpds-installer/installer/install.sh tests/*.sh; do
            bash -n "$f" || exit 1
          done
      - name: shellcheck
        continue-on-error: true
        run: |
          command -v shellcheck || sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck -S error tools/mlpds build/*.sh tools/mlpds-installer/installer/install.sh
      - name: run mlpds tests
        run: sudo bash tests/test_mlpds.sh
      - name: compile-check turbo tray (python)
        run: python3 -m py_compile tools/mlpds-installer/installer/install.sh components/turbo/deposit-tray.py 2>/dev/null || python3 -m py_compile components/turbo/deposit-tray.py
      - name: run aqa + turbo tests
        run: sudo bash tests/test_aqa.sh

  # --------------------------------------------------------------------------
  # 2) Compile the Linux kernel from upstream source (truly "from the kernel").
  # --------------------------------------------------------------------------
  build-kernel:
    name: build kernel from source
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: build deps
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential bc flex bison libelf-dev libssl-dev wget xz-utils cpio kmod ccache
      - name: compile kernel
        run: sudo bash build/build-kernel.sh
      - name: package kernel tarball
        run: sudo tar -C build/output -cf build/output/kernel.tar kernel
      - name: upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: deposit-kernel
          path: build/output/kernel.tar
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # 3) Assemble the apt/.deb-compatible userspace (debootstrap).
  # --------------------------------------------------------------------------
  build-rootfs:
    name: assemble userspace (apt compatible)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: install debootstrap
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends debootstrap
      - name: build rootfs
        run: sudo bash build/build-rootfs.sh build/output/rootfs
      - name: package rootfs tarball
        # Upload as a single archive: raw rootfs trees contain /dev device nodes
        # that upload-artifact cannot pack.
        run: sudo tar -C build/output -cf build/output/rootfs.tar rootfs
      - name: upload rootfs
        uses: actions/upload-artifact@v4
        with:
          name: deposit-rootfs
          path: build/output/rootfs.tar
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # 4) Package a real .mlpds install file from the built kernel + rootfs.
  # --------------------------------------------------------------------------
  package:
    name: package .mlpds installer
    runs-on: ubuntu-24.04
    needs: [build-kernel, build-rootfs]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deposit-kernel
          path: build/output
      - uses: actions/download-artifact@v4
        with:
          name: deposit-rootfs
          path: build/output
      - name: extract artifacts
        run: |
          sudo tar -xf build/output/kernel.tar -C build/output
          sudo tar -xf build/output/rootfs.tar -C build/output
      - name: create .mlpds
        run: |
          sudo bash tools/mlpds create \
            --rootfs build/output/rootfs \
            --kernel build/output/kernel \
            --out deposit.os.mlpds \
            --type os
          sudo bash tools/mlpds info deposit.os.mlpds
      - name: upload .mlpds
        uses: actions/upload-artifact@v4
        with:
          name: deposit-os-mlpds
          path: deposit.os.mlpds
          if-no-files-found: error
