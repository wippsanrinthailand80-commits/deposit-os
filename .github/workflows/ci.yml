name: Deposit OS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # --------------------------------------------------------------------------
  # 1) Tool + .mlpds unit tests, plus a tool-demo screenshot. Fast, no network.
  # --------------------------------------------------------------------------
  tool-tests:
    name: mlpds tool + scripts + demo
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: syntax check
        run: |
          for f in tools/mlpds build/*.sh tools/mlpds-installer/installer/install.sh tests/*.sh ci/*.sh; do
            bash -n "$f" || exit 1
          done
      - name: shellcheck
        continue-on-error: true
        run: |
          command -v shellcheck || sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck -S error tools/mlpds build/*.sh tools/mlpds-installer/installer/install.sh
      - name: run mlpds tests
        run: sudo bash tests/test_mlpds.sh
      - name: compile-check python tools
        run: |
          python3 -m py_compile tools/mlpds-installer/installer/install.sh components/turbo/deposit-tray.py 2>/dev/null || python3 -m py_compile components/turbo/deposit-tray.py
          python3 -m py_compile tools/deposit-quickmenu tools/deposit-security tools/deposit-updater tools/deposit-store tools/deposit-oobe
      - name: run aqa + turbo tests
        run: sudo bash tests/test_aqa.sh
      - name: tool demo + screenshot
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -qq
          sudo apt-get install -y --no-install-recommends xvfb xterm scrot python3-pil fonts-dejavu
          chmod +x tools/mlpds tools/aqa tools/deposit-turbo
          mkdir -p /tmp/shots
          xvfb-run -a bash -c 'xterm -geometry 120x44 -e "bash ci/demo.sh; echo; echo [capturing...]; sleep 3" & sleep 12; scrot -o /tmp/shots/demo_raw.png' || true
          python3 ci/render_log.py /tmp/shots/demo.log /tmp/shots/demo.png "Deposit OS — tool demo (.mlpds + AQA)" 2>/tmp/shots/render.err \
            || cp /tmp/shots/demo_raw.png /tmp/shots/demo.png 2>/dev/null \
            || true
          ls -l /tmp/shots/demo.png
      - name: publish demo to job summary
        run: |
          echo "### Deposit OS — tool demo (.mlpds + AQA)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "![tool demo](data:image/png;base64,$(base64 -w0 /tmp/shots/demo.png))" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          sed 's/</\&lt;/g; s/>/\&gt;/g' /tmp/shots/demo.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: upload demo screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tool-demo-screenshot
          path: /tmp/shots/demo.png
          if-no-files-found: warn

  # --------------------------------------------------------------------------
  # 2) Compile the Linux kernel from upstream source (truly "from the kernel").
  # --------------------------------------------------------------------------
  build-kernel:
    name: build kernel from source
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: cache kernel build tree
        uses: actions/cache@v4
        with:
          path: build/output/linux-6.6.58
          key: kernel-${{ hashFiles('build/config.sh', 'build/build-kernel.sh', 'build/kernel-fragments/deposit-broad.cfg') }}
      - name: build deps
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential bc flex bison libelf-dev libssl-dev wget xz-utils cpio kmod ccache
      - name: compile kernel
        # Enlarged (real-hardware) kernel: use both runner cores so the
        # bigger build stays under the timeout. Lower DEPOSIT_KERNEL_JOBS for
        # less RAM at the cost of build time.
        run: sudo DEPOSIT_KERNEL_JOBS=2 bash build/build-kernel.sh
      - name: package kernel tarball
        run: sudo tar -C build/output -cf build/output/kernel.tar kernel
      - name: upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: deposit-kernel
          path: build/output/kernel.tar
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # 3) Assemble the apt/.deb-compatible userspace (debootstrap + XFCE GUI).
  # --------------------------------------------------------------------------
  build-rootfs:
    name: assemble userspace (apt compatible)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: install debootstrap
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends debootstrap
      - name: build rootfs
        run: sudo bash build/build-rootfs.sh build/output/rootfs
      - name: package rootfs tarball
        # Upload as a single archive: raw rootfs trees contain /dev device nodes
        # that upload-artifact cannot pack.
        run: sudo tar -C build/output -cf build/output/rootfs.tar rootfs
      - name: upload rootfs
        uses: actions/upload-artifact@v4
        with:
          name: deposit-rootfs
          path: build/output/rootfs.tar
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # 4) Package the .mlpds installer, THEN actually boot Deposit OS in QEMU and
  #    screenshot the boot screen, the GUI, and a terminal running AQA.
  # --------------------------------------------------------------------------
  package-and-live:
    name: package .mlpds + live boot
    runs-on: ubuntu-24.04
    needs: [build-kernel, build-rootfs]
    permissions:
      contents: write
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: install qemu + capture deps
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            qemu-system-x86 python3 xvfb xterm scrot python3-pil fonts-dejavu gnupg
      - uses: actions/download-artifact@v4
        with:
          name: deposit-kernel
          path: build/output
      - uses: actions/download-artifact@v4
        with:
          name: deposit-rootfs
          path: build/output
      - name: extract artifacts
        run: |
          sudo tar -xf build/output/kernel.tar -C build/output
          sudo tar -xf build/output/rootfs.tar -C build/output
      - name: prepare release signing key
        env:
          DEPOSIT_GPG_KEY: ${{ secrets.DEPOSIT_GPG_KEY }}
        run: |
          install -d ci
          printf '%s\n' "$DEPOSIT_GPG_KEY" > ci/release-key.asc
          echo "release signing key ready ($(wc -l < ci/release-key.asc) lines)"
      - name: create .mlpds
        run: |
          sudo bash -c 'DEPOSIT_GPG_PRIVATE_FILE="$PWD/ci/release-key.asc" bash tools/mlpds create \
            --rootfs build/output/rootfs \
            --kernel build/output/kernel \
            --out deposit.os.mlpds \
            --type os'
          sudo bash tools/mlpds info deposit.os.mlpds
      - name: screenshot the built .mlpds (info)
        run: |
          chmod +x tools/mlpds
          mkdir -p /tmp/os-shot
          xvfb-run -a bash -c 'xterm -geometry 100x40 -e bash ci/os-info.sh & sleep 10; scrot -o /tmp/os-shot/os_raw.png' || true
          python3 ci/render_log.py /tmp/os-shot/os.log /tmp/os-shot/os.png "Deposit OS — mlpds info" 2>/dev/null \
            || cp /tmp/os-shot/os_raw.png /tmp/os-shot/os.png 2>/dev/null \
            || true
          ls -l /tmp/os-shot/os.png 2>/dev/null || echo "no png"
      - name: build disk + boot + live screenshots
        run: bash ci/live-boot.sh
      - name: publish screenshots to job summary
        if: always()
        run: |
          echo "### Deposit OS — packaged .mlpds (info)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "![os mlpds](data:image/png;base64,$(base64 -w0 /tmp/os-shot/os.png))" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Deposit OS — live boot (boot screen, GUI, AQA terminal)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          for p in /tmp/shots/live-*.png; do
            [ -s "$p" ] || continue
            echo "![live $(basename "$p")](data:image/png;base64,$(base64 -w0 "$p"))" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: os-and-live-screenshots
          path: |
            /tmp/os-shot/os.png
            /tmp/shots/live-*.png
          if-no-files-found: warn

      # ---- Build a bootable ISO and publish it to a continuous release ------
      - name: install ISO build deps
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            xorriso mtools grub-efi-amd64-bin grub-pc-bin squashfs-tools initramfs-tools
      - name: build bootable ISO
        continue-on-error: true
        run: sudo bash ci/make-iso.sh build/output/rootfs build/output/kernel build/output/deposit-os.iso
      - name: boot-check ISO (non-fatal)
        continue-on-error: true
        run: |
          qemu-system-x86_64 -m 2048 -smp 2 -cpu max -cdrom build/output/deposit-os.iso -boot d \
            -vnc :1 -qmp tcp:127.0.0.1:4445,server,nowait -daemonize
          sleep 100
          python3 ci/qmp_screendump.py /tmp/iso-boot.png 127.0.0.1 4445 || true
          pkill -f qemu-system-x86_64 || true
      - name: upload ISO
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deposit-os.iso
          path: build/output/deposit-os.iso
          if-no-files-found: warn
      - name: publish ISO to continuous release
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN: ${{ github.run_id }}
        run: bash ci/publish-release.sh build/output/deposit-os.iso deposit.os.mlpds
