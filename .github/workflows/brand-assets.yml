# Generates the Andromeda photo-cutout logo (same recipe as build-rootfs)
# without needing a full distro build. Run manually: gh workflow run brand-assets.yml
name: brand-assets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  logo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: cut the galaxy out of the photo
        run: |
          pip3 install --quiet pillow || pip3 install --quiet --break-system-packages pillow || true
          python3 ci/make-logo.py
      - uses: actions/upload-artifact@v4
        with:
          name: deposit-logo
          path: deposit-logo.png
